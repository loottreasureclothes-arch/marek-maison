<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Montaris · Vista celular</title><link rel="icon" href="img/favicon.png"><meta name="robots" content="noindex">
<style>body{margin:0;background:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#222;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.barra{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 16px;font-size:13px}
.barra a,.barra button{background:#fff;border:1px solid #c9c9c9;border-radius:999px;padding:6px 12px;font:inherit;color:#222;cursor:pointer;text-decoration:none}
.barra .on{background:#111;color:#fff;border-color:#111}
.cuadro{width:390px;height:844px;max-width:calc(100vw - 16px);background:#fff;border:1px solid #c9c9c9;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
iframe{width:100%;height:100%;border:0;display:block}
small{color:#777;padding-bottom:14px}</style></head><body>
<div class="barra" id="barra">
<button data-u="index.html" class="on">Inicio</button><button data-u="coleccion.html?c=hombre">Hombre</button><button data-u="coleccion.html?c=cadenas">Cadenas</button><button data-u="producto.html?id=50">Producto</button><button data-u="pago.html">Pago</button><a id="abrir" href="index.html" target="_blank">Abrir en pestaña ↗</a>
</div>
<div class="cuadro"><iframe id="f" src="index.html?v=1792525435" title="Montaris en celular"></iframe></div>
<small>Vista de 390 × 844. Navega adentro como en un celular.</small>
<script>document.getElementById('barra').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.getElementById('f').src=b.dataset.u;document.getElementById('abrir').href=b.dataset.u;document.querySelectorAll('#barra button').forEach(x=>x.classList.toggle('on',x===b))});</script>
</body></html>
